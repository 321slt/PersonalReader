name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-v4.11.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s PersonalReader-Android-v4.11.zip
          rm -rf extracted android-project
          mkdir -p extracted android-project
          unzip -q PersonalReader-Android-v4.11.zip -d extracted

          ASSET_DIR="$(find extracted -type d -path '*/app/src/main/assets' -print -quit)"
          if [[ -z "${ASSET_DIR}" ]]; then
            echo "ERROR: Could not find app/src/main/assets in the Android archive."
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          if [[ ! -f "${ASSET_DIR}/index.html" ]]; then
            ENTRY="$(find "${ASSET_DIR}" -type f \( -name 'index.html' -o -name '*.html' \) -print -quit)"
          else
            ENTRY="${ASSET_DIR}/index.html"
          fi
          if [[ -z "${ENTRY}" ]]; then
            echo "ERROR: No HTML entry point found in Android assets."
            exit 1
          fi

          ENTRY_REL="${ENTRY#${ASSET_DIR}/}"
          echo "ASSET_DIR=${ASSET_DIR}"
          echo "ENTRY_REL=${ENTRY_REL}"

          mkdir -p android-project/app/src/main/assets
          cp -a "${ASSET_DIR}/." android-project/app/src/main/assets/
          echo "ENTRY_REL=${ENTRY_REL}" >> "$GITHUB_ENV"

      - name: Generate clean Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project/app/src/main/java/com/personalreader/app
          mkdir -p android-project/app/src/main/res/values

          cat > android-project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PersonalReader"
          include(":app")
          EOF

          cat > android-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.personalreader.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.personalreader.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 411
                  versionName = "4.11.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.17.0")
          }
          EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Personal Reader</string>
          </resources>
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          ENTRY_ESCAPED="$(printf '%s' "$ENTRY_REL" | sed 's/[\\&]/\\&/g; s/"/\\"/g')"
          cat > android-project/app/src/main/java/com/personalreader/app/MainActivity.java <<EOF
          package com.personalreader.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Build;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public final class MainActivity extends Activity {
              private static final String START_PAGE = "${ENTRY_ESCAPED}";
              private static final int FILE_CHOOSER_REQUEST = 42011;

              private WebView webView;
              private ValueCallback<Uri[]> pendingFileCallback;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createWebView();
              }

              private void createWebView() {
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (scheme == null || "https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme)) {
                              if ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme)) {
                                  try {
                                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                                      return true;
                                  } catch (ActivityNotFoundException ignored) {
                                      return false;
                                  }
                              }
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript("document.documentElement.dataset.androidApp='true';", null);
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, android.webkit.RenderProcessGoneDetail detail) {
                          if (view == webView) {
                              setContentView(null);
                              webView.destroy();
                              createWebView();
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (pendingFileCallback != null) {
                              pendingFileCallback.onReceiveValue(null);
                          }
                          pendingFileCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          String[] mimeTypes = {
                                  "application/epub+zip",
                                  "application/pdf",
                                  "text/plain",
                                  "text/markdown",
                                  "text/html",
                                  "application/xhtml+xml",
                                  "application/zip",
                                  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                                  "application/octet-stream"
                          };
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);

                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              pendingFileCallback.onReceiveValue(null);
                              pendingFileCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/" + START_PAGE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || pendingFileCallback == null) {
                      return;
                  }

                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];
                          for (int i = 0; i < count; i++) {
                              results[i] = data.getClipData().getItemAt(i).getUri();
                              persistReadPermission(results[i], data);
                          }
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                          persistReadPermission(results[0], data);
                      }
                  }

                  pendingFileCallback.onReceiveValue(results);
                  pendingFileCallback = null;
              }

              private void persistReadPermission(Uri uri, Intent data) {
                  if (uri == null || Build.VERSION.SDK_INT < Build.VERSION_CODES.KITKAT) {
                      return;
                  }
                  try {
                      getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                  } catch (SecurityException ignored) {
                      try {
                          getContentResolver().takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (SecurityException ignoredAgain) {
                          // Some providers do not grant persistable permissions.
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (pendingFileCallback != null) {
                      pendingFileCallback.onReceiveValue(null);
                      pendingFileCallback = null;
                  }
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          echo "Generated Android wrapper with WebViewAssetLoader and AndroidX WebKit 1.17.0."
          echo "Entry page: ${ENTRY_REL}"

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          rm -rf "$RUNNER_TEMP/gradle"
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Validate project before build
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/personalreader/app/MainActivity.java
          test -s "app/src/main/assets/${ENTRY_REL}"
          grep -q 'androidx.webkit:webkit:1.17.0' app/build.gradle.kts
          grep -q 'WebViewAssetLoader' app/src/main/java/com/personalreader/app/MainActivity.java
          gradle --no-daemon --stacktrace :app:tasks >/dev/null

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apkanalyzer" manifest application-id "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
