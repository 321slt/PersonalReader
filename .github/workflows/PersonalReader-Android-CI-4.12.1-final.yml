name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Android project archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ARCHIVES < <(
            find . -maxdepth 1 -type f -name 'PersonalReader-Android-*.zip' -printf '%f\n' \
            | sort -V
          )

          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "ERROR: No PersonalReader-Android-*.zip archive exists at repository root."
            echo "Repository root:"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi

          # Prefer the newest versioned archive.
          ARCHIVE="${ARCHIVES[${#ARCHIVES[@]}-1}]"

          if [ "${#ARCHIVES[@]}" -gt 1 ]; then
            echo "Found multiple Android archives:"
            printf '  %s\n' "${ARCHIVES[@]}"
            echo "Using newest: ${ARCHIVE}"
          else
            echo "Using Android archive: ${ARCHIVE}"
          fi

          unzip -t "${ARCHIVE}" >/dev/null
          echo "ANDROID_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted

          unzip -q "${ANDROID_ARCHIVE}" -d extracted

          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "ERROR: settings.gradle.kts was not found in ${ANDROID_ARCHIVE}."
            echo "Archive contents:"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          if [ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found in ${PROJECT_DIR}."
            exit 1
          fi

          if [ ! -f "${PROJECT_DIR}/app/src/main/java/com/personalreader/app/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java was not found."
            exit 1
          fi

          if [ ! -d "${PROJECT_DIR}/app/src/main/assets" ]; then
            echo "ERROR: Android assets directory was not found."
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${PROJECT_DIR}"

      - name: Validate optimized Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 412' app/build.gradle.kts
          grep -q 'com.personalreader.app' app/src/main/AndroidManifest.xml
          grep -q 'androidApp' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'preferredRefreshRate' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'setOnApplyWindowInsetsListener' app/src/main/java/com/personalreader/app/MainActivity.java

          test -s app/src/main/assets/www/index.html

          echo "Project validation passed."

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          rm -rf "$RUNNER_TEMP/gradle"
          mkdir -p "$RUNNER_TEMP/gradle"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK generated successfully:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-4.12-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
