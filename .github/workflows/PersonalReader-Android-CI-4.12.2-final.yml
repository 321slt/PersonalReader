name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Android project archive
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the known optimized archive. Fall back to the newest
          # PersonalReader-Android archive without using fragile Bash arrays.
          if [ -f "PersonalReader-Android-optimized-4.12.zip" ]; then
            ARCHIVE="PersonalReader-Android-optimized-4.12.zip"
          else
            ARCHIVE="$(find . -maxdepth 1 -type f -name 'PersonalReader-Android-*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi

          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: No PersonalReader-Android-*.zip archive was found in the repository root."
            echo "Repository root contents:"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi

          if [ ! -s "${ARCHIVE}" ]; then
            echo "ERROR: Selected archive is empty: ${ARCHIVE}"
            exit 1
          fi

          echo "Selected archive: ${ARCHIVE}"
          echo "Archive size:"
          ls -lh "${ARCHIVE}"

          echo "Testing ZIP integrity..."
          unzip -t "${ARCHIVE}" >/dev/null
          echo "ZIP integrity check passed."

          echo "ANDROID_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project
          unzip -q "${ANDROID_ARCHIVE}" -d android-project

          PROJECT_DIR="$(find android-project -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo "ERROR: settings.gradle.kts was not found after extraction."
            echo "Extracted files:"
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi
          PROJECT_DIR="$(dirname "${PROJECT_DIR}")"

          test -f "${PROJECT_DIR}/build.gradle.kts"
          test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          test -f "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"
          test -f "${PROJECT_DIR}/app/src/main/java/com/personalreader/app/MainActivity.java"
          test -s "${PROJECT_DIR}/app/src/main/assets/www/index.html"

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${PROJECT_DIR}"

      - name: Validate project before build
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Checking Android configuration..."
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 412' app/build.gradle.kts
          grep -q 'versionName = "4.12.0"' app/build.gradle.kts

          echo "Checking optimization implementation..."
          grep -q 'preferredRefreshRate' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'setOnApplyWindowInsetsListener' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'setDecorFitsSystemWindows(false)' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'showLaunchAnimation' app/src/main/java/com/personalreader/app/MainActivity.java

          echo "Checking web application..."
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/app.js
          test -s app/src/main/assets/www/styles.css

          echo "Project validation passed."

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gradle >/dev/null 2>&1 || ! gradle --version | grep -q 'Gradle 9.6'; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
              -o "$RUNNER_TEMP/gradle.zip"
            rm -rf "$RUNNER_TEMP/gradle"
            mkdir -p "$RUNNER_TEMP/gradle"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
            echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          fi

          gradle --version

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK generated successfully:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-4.12-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
