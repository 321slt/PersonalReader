name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-*.zip'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/PersonalReader-Android-CI-4.12.2-final.yml'

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.6.0'
  ANDROID_API: '36'
  BUILD_TOOLS: '36.0.0'

jobs:
  build-debug-apk:
    name: Build and verify Personal Reader APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Locate Android project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=''
          for candidate in \
            'PersonalReader-Android-4.12.2.zip' \
            'PersonalReader-Android-optimized-4.12.1.zip' \
            'PersonalReader-Android-optimized-4.12.zip' \
            'PersonalReader-Android-v4.11.zip'; do
            if [ -s "$candidate" ]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 1 -type f -name 'PersonalReader-Android-*.zip' -print | sort -V | tail -n 1)"
          fi

          if [ -z "$ARCHIVE" ]; then
            echo 'ERROR: No Personal Reader Android archive was found in the repository root.'
            find . -maxdepth 2 -type f -name '*.zip' -print | sort
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-work
          mkdir -p android-work
          unzip -q "$ARCHIVE" -d android-work

          PROJECT_DIR="$(find android-work -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle.kts was not found inside the Android archive.'
            find android-work -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Repair and harden Android project
        shell: bash
        run: |
          set -euo pipefail
          export PROJECT_DIR
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ['PROJECT_DIR'])
          manifest = root / 'app/src/main/AndroidManifest.xml'
          main = root / 'app/src/main/java/com/personalreader/app/MainActivity.java'
          gradle = root / 'app/build.gradle.kts'
          web = root / 'app/src/main/assets/www'

          required = [manifest, main, gradle, web / 'index.html', web / 'app.js', web / 'styles.css']
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing required project files: ' + ', '.join(missing))

          # Repair duplicate application attributes from older archives.
          text = manifest.read_text(encoding='utf-8')
          text = re.sub(
              r'(\s+android:hardwareAccelerated="true")\s+android:hardwareAccelerated="true"',
              r'\1',
              text,
              count=1,
          )
          manifest.write_text(text, encoding='utf-8')
          ET.parse(manifest)

          # The old generated archive accidentally left a template token in the
          # native launcher. Always force the real bundled HTML entry point.
          text = main.read_text(encoding='utf-8')
          text = text.replace('__ENTRY_REL__', 'www/index.html')
          text = text.replace('private static final int VERSION_CODE = 412;', 'private static final int VERSION_CODE = 4122;')
          text = text.replace('params.preferredDisplayModeId = 0;', 'if (Build.VERSION.SDK_INT >= 31) {\n            params.preferredDisplayModeId = best.getModeId();\n        }')
          if 'settings.setOffscreenPreRaster(true);' not in text:
              text = text.replace(
                  'settings.setTextZoom(100);',
                  'settings.setTextZoom(100);\n        if (Build.VERSION.SDK_INT >= 26) {\n            settings.setOffscreenPreRaster(true);\n        }',
              )
          if 'setRendererPriorityPolicy' not in text:
              text = text.replace(
                  'webView.setHorizontalScrollBarEnabled(false);',
                  'webView.setHorizontalScrollBarEnabled(false);\n        if (Build.VERSION.SDK_INT >= 26) {\n            webView.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, true);\n        }',
              )
          main.write_text(text, encoding='utf-8')

          # Keep web/native version identifiers coherent.
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 4122', g)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "4.12.2"', g)
          gradle.write_text(g, encoding='utf-8')

          pkg = web / 'package.json'
          if pkg.is_file():
              p = pkg.read_text(encoding='utf-8')
              p = re.sub(r'"version"\s*:\s*"[^"]+"', '"version":"4.12.2"', p, count=1)
              pkg.write_text(p, encoding='utf-8')

          sw = web / 'sw.js'
          if sw.is_file():
              p = sw.read_text(encoding='utf-8').replace('personalreader-v4.11', 'personalreader-v4.12.2')
              sw.write_text(p, encoding='utf-8')

          print('Android project repair: PASS')
          PY

      - name: Run web regression tests
        working-directory: ${{ env.PROJECT_DIR }}/app/src/main/assets/www
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression.mjs
          node tests/overlay-position.mjs

      - name: Validate generated project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/java/com/personalreader/app/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          grep -q 'www/index.html' app/src/main/java/com/personalreader/app/MainActivity.java
          ! grep -q '__ENTRY_REL__' app/src/main/java/com/personalreader/app/MainActivity.java
          test "$(grep -c 'android:hardwareAccelerated="true"' app/src/main/AndroidManifest.xml)" -eq 1
          grep -q 'versionCode = 4122' app/build.gradle.kts
          grep -q 'versionName = "4.12.2"' app/build.gradle.kts
          echo 'Generated Android project validation: PASS'

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PersonalReader-debug-apk-4.12.2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
