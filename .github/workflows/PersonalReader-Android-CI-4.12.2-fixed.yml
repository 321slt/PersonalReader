name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Android project archive
        id: locate_archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""
          if [ -f "PersonalReader-Android-optimized-4.12.1.zip" ]; then
            ARCHIVE="PersonalReader-Android-optimized-4.12.1.zip"
          elif [ -f "PersonalReader-Android-optimized-4.12.zip" ]; then
            ARCHIVE="PersonalReader-Android-optimized-4.12.zip"
          elif [ -f "PersonalReader-Android-v4.11.zip" ]; then
            ARCHIVE="PersonalReader-Android-v4.11.zip"
          else
            ARCHIVE="$(find . -maxdepth 1 -type f -name 'PersonalReader-Android-*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No PersonalReader Android archive was found in the repository root."
            echo "Expected a file matching PersonalReader-Android-*.zip"
            exit 1
          fi

          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          echo "Using archive: $ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted android-project
          mkdir -p extracted android-project
          unzip -q "${{ steps.locate_archive.outputs.ARCHIVE }}" -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the Android archive."
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          cp -a "$PROJECT_DIR/." android-project/
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Extracted project: $PROJECT_DIR"

      - name: Repair and validate Android project
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-project/app/src/main/AndroidManifest.xml"
          GRADLE="android-project/app/build.gradle.kts"
          ACTIVITY="android-project/app/src/main/java/com/personalreader/app/MainActivity.java"

          test -f "$MANIFEST"
          test -f "$GRADLE"
          test -f "$ACTIVITY"

          # The optimized 4.12 archive currently contains the same
          # android:hardwareAccelerated attribute twice. Remove only the
          # second occurrence; do not alter any other manifest attributes.
          MANIFEST="$MANIFEST" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["MANIFEST"])
          text = path.read_text(encoding="utf-8")
          needle = 'android:hardwareAccelerated="true"'
          count = text.count(needle)

          if count == 2:
              first = text.find(needle)
              second = text.find(needle, first + len(needle))
              text = text[:second] + text[second + len(needle):]
              path.write_text(text, encoding="utf-8")
              print("Removed one duplicate android:hardwareAccelerated attribute.")
          elif count == 1:
              print("android:hardwareAccelerated is already unique.")
          else:
              raise SystemExit(f"Unexpected android:hardwareAccelerated count: {count}")
          PY

          # Validate the resulting manifest with a strict XML parser before
          # allowing Gradle's manifest merger to run.
          MANIFEST="$MANIFEST" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(os.environ["MANIFEST"])
          ET.parse(path)
          print("AndroidManifest.xml: valid XML")
          PY

          # Check the app's key files and optimized Android features.
          grep -q 'versionCode = 412\|versionCode = 413' "$GRADLE"
          grep -q 'compileSdk = 36' "$GRADLE"
          grep -q 'targetSdk = 36' "$GRADLE"
          grep -q 'androidx.webkit:webkit:1.17.0' "$GRADLE"
          grep -q 'requestBestRefreshRate' "$ACTIVITY"
          grep -q 'applySafeInsets' "$ACTIVITY"
          grep -q 'showLaunchAnimation' "$ACTIVITY"
          grep -q 'hardwareAccelerated="true"' "$MANIFEST"

          # Make sure the web entry point is present.
          test -s android-project/app/src/main/assets/www/index.html

          echo "Android project preflight: PASS"

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
