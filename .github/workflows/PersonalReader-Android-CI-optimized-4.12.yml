name: Build Personal Reader Android - Optimized 4.12

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-v4.11.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract web application from Android archive
        shell: bash
        run: |
          set -euo pipefail
          test -s PersonalReader-Android-v4.11.zip
          rm -rf extracted android-project
          mkdir -p extracted android-project
          unzip -q PersonalReader-Android-v4.11.zip -d extracted

          ASSET_DIR="$(find extracted -type d -path '*/app/src/main/assets' -print -quit)"
          if [[ -z "${ASSET_DIR}" ]]; then
            echo "ERROR: app/src/main/assets was not found in the archive."
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          if [[ -f "${ASSET_DIR}/index.html" ]]; then
            ENTRY_REL="index.html"
          else
            ENTRY="$(find "${ASSET_DIR}" -type f \( -name 'index.html' -o -name '*.html' \) -print -quit)"
            if [[ -z "${ENTRY}" ]]; then
              echo "ERROR: No HTML entry point exists in app/src/main/assets."
              find "${ASSET_DIR}" -maxdepth 3 -type f | sort
              exit 1
            fi
            ENTRY_REL="${ENTRY#${ASSET_DIR}/}"
          fi

          mkdir -p android-project/app/src/main/assets
          cp -a "${ASSET_DIR}/." android-project/app/src/main/assets/
          echo "ENTRY_REL=${ENTRY_REL}" >> "$GITHUB_ENV"
          echo "Android web entry: ${ENTRY_REL}"

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project/app/src/main/java/com/personalreader/app
          mkdir -p android-project/app/src/main/res/values

          cat > android-project/settings.gradle.kts <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PersonalReader"
          include(":app")
          SETTINGS

          cat > android-project/build.gradle.kts <<'ROOT'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          ROOT

          cat > android-project/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS

          cat > android-project/app/build.gradle.kts <<'APP'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.personalreader.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.personalreader.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 412
                  versionName = "4.12.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          APP

          cat > android-project/app/src/main/res/values/strings.xml <<'STRINGS'
          <resources>
              <string name="app_name">Personal Reader</string>
          </resources>
          STRINGS

          cat > android-project/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # Generate a deliberately dependency-free Activity.  This avoids the
          # AndroidX WebKit/annotation symbols that caused the previous Java
          # compilation failures while retaining the complete web application.
          cat > android-project/app/src/main/java/com/personalreader/app/MainActivity.java <<'JAVA'
          package com.personalreader.app;
          
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          
          public final class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST = 42011;
              private static final int VERSION_CODE = 412;
              private static final String START_PAGE = "__ENTRY_REL__";
          
              private FrameLayout root;
              private WebView webView;
              private FrameLayout launchOverlay;
              private ValueCallback<Uri[]> pendingFileCallback;
              private long launchStartedAt;
              private boolean launchDismissed;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureWindowForModernAndroid();
                  requestBestRefreshRate();
                  createRootAndWebView();
                  showLaunchAnimation();
              }
          
              private void configureWindowForModernAndroid() {
                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  if (Build.VERSION.SDK_INT >= 30) {
                      window.setNavigationBarDividerColor(Color.TRANSPARENT);
                      window.getAttributes().layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      window.setNavigationBarDividerColor(Color.TRANSPARENT);
                      window.getAttributes().layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  if (Build.VERSION.SDK_INT >= 29) {
                      window.setStatusBarContrastEnforced(false);
                      window.setNavigationBarContrastEnforced(false);
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }
          
              private void requestBestRefreshRate() {
                  if (Build.VERSION.SDK_INT < 30) {
                      return;
                  }
                  Display display = getDisplay();
                  if (display == null) {
                      return;
                  }
                  Display.Mode current = display.getMode();
                  Display.Mode best = current;
                  for (Display.Mode mode : display.getSupportedModes()) {
                      if (mode.getPhysicalWidth() != current.getPhysicalWidth()
                              || mode.getPhysicalHeight() != current.getPhysicalHeight()) {
                          continue;
                      }
                      if (mode.getRefreshRate() > best.getRefreshRate()) {
                          best = mode;
                      }
                  }
                  WindowManager.LayoutParams params = getWindow().getAttributes();
                  params.preferredRefreshRate = best.getRefreshRate();
                  params.preferredDisplayModeId = 0;
                  getWindow().setAttributes(params);
              }
          
              @SuppressLint("SetJavaScriptEnabled")
              private void createRootAndWebView() {
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(11, 13, 16));
                  setContentView(root);
          
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);
          
                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT);
                  root.addView(webView, webParams);
          
                  webView.setOnApplyWindowInsetsListener((view, insets) -> {
                      applySafeInsets(insets);
                      return insets;
                  });
          
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setTextZoom(100);
          
                  if (Build.VERSION.SDK_INT >= 29) {
                      settings.setForceDark(WebSettings.FORCE_DARK_OFF);
                  }
          
                  CookieManager.getInstance().setAcceptCookie(true);
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return openExternalIfNeeded(request.getUrl());
                      }
          
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return openExternalIfNeeded(Uri.parse(url));
                      }
          
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                                  "document.documentElement.dataset.androidApp='true';"
                                          + "document.documentElement.dataset.androidVersion='" + VERSION_CODE + "';"
                                          + "(function(){var s=document.getElementById('pr-native-compat');"
                                          + "if(!s){s=document.createElement('style');s.id='pr-native-compat';"
                                          + "s.textContent='html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none;}';"
                                          + "document.head.appendChild(s);}})();",
                                  null);
                          scheduleLaunchDismissal(520);
                      }
          
                      @Override
                      public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          super.onReceivedError(view, errorCode, description, failingUrl);
                          scheduleLaunchDismissal(0);
                      }
          
                      @Override
                      public boolean onRenderProcessGone(WebView view, android.webkit.RenderProcessGoneDetail detail) {
                          if (view == webView) {
                              view.destroy();
                              webView = null;
                              recreate();
                          }
                          return true;
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (pendingFileCallback != null) {
                              pendingFileCallback.onReceiveValue(null);
                          }
                          pendingFileCallback = filePathCallback;
          
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {
                                  "application/epub+zip",
                                  "application/pdf",
                                  "text/plain",
                                  "text/markdown",
                                  "text/html",
                                  "application/xhtml+xml",
                                  "application/zip",
                                  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                                  "application/octet-stream"
                          });
          
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              pendingFileCallback.onReceiveValue(null);
                              pendingFileCallback = null;
                              return false;
                          }
                      }
                  });
          
                  webView.post(() -> webView.requestApplyInsets());
                  webView.loadUrl("file:///android_asset/" + START_PAGE);
              }
          
              private boolean openExternalIfNeeded(Uri uri) {
                  String scheme = uri.getScheme();
                  if (scheme == null || "file".equalsIgnoreCase(scheme)) {
                      return false;
                  }
                  if ("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme)) {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      } catch (ActivityNotFoundException ignored) {
                          return false;
                      }
                  }
                  return true;
              }
          
              private void applySafeInsets(android.view.WindowInsets insets) {
                  int top;
                  int bottom;
                  int left;
                  int right;
          
                  if (Build.VERSION.SDK_INT >= 30) {
                      android.graphics.Insets system = insets.getInsets(
                              android.view.WindowInsets.Type.statusBars()
                                      | android.view.WindowInsets.Type.navigationBars()
                                      | android.view.WindowInsets.Type.displayCutout());
                      android.graphics.Insets ime = insets.getInsets(android.view.WindowInsets.Type.ime());
                      top = system.top;
                      bottom = Math.max(system.bottom, ime.bottom);
                      left = system.left;
                      right = system.right;
                  } else {
                      top = insets.getSystemWindowInsetTop();
                      bottom = insets.getSystemWindowInsetBottom();
                      left = insets.getSystemWindowInsetLeft();
                      right = insets.getSystemWindowInsetRight();
                  }
          
                  if (webView != null) {
                      ViewGroup.LayoutParams raw = webView.getLayoutParams();
                      FrameLayout.LayoutParams params = raw instanceof FrameLayout.LayoutParams
                              ? (FrameLayout.LayoutParams) raw
                              : new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT);
                      if (params.leftMargin != left || params.topMargin != top
                              || params.rightMargin != right || params.bottomMargin != bottom) {
                          params.leftMargin = left;
                          params.topMargin = top;
                          params.rightMargin = right;
                          params.bottomMargin = bottom;
                          webView.setLayoutParams(params);
                      }
                  }
              }
          
              private void showLaunchAnimation() {
                  launchStartedAt = SystemClock.elapsedRealtime();
          
                  launchOverlay = new FrameLayout(this);
                  launchOverlay.setBackgroundColor(Color.rgb(11, 13, 16));
                  launchOverlay.setClickable(true);
                  launchOverlay.setFocusable(true);
                  if (Build.VERSION.SDK_INT >= 21) {
                      launchOverlay.setElevation(1000f);
                  }
          
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setGravity(Gravity.CENTER_HORIZONTAL);
          
                  TextView logo = new TextView(this);
                  logo.setText("PR");
                  logo.setTextColor(Color.rgb(11, 13, 16));
                  logo.setTextSize(24f);
                  logo.setGravity(Gravity.CENTER);
                  logo.setTypeface(android.graphics.Typeface.create("sans", android.graphics.Typeface.BOLD));
                  GradientDrawable logoBg = new GradientDrawable();
                  logoBg.setColor(Color.rgb(124, 111, 240));
                  logoBg.setCornerRadius(dp(22));
                  logo.setBackground(logoBg);
                  logo.setElevation(dp(10));
          
                  TextView title = new TextView(this);
                  title.setText("Personal Reader");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(21f);
                  title.setTypeface(android.graphics.Typeface.create("sans", android.graphics.Typeface.BOLD));
                  title.setGravity(Gravity.CENTER);
          
                  TextView subtitle = new TextView(this);
                  subtitle.setText("A calmer way to read.");
                  subtitle.setTextColor(Color.rgb(166, 168, 176));
                  subtitle.setTextSize(12f);
                  subtitle.setGravity(Gravity.CENTER);
          
                  LinearLayout.LayoutParams logoParams = new LinearLayout.LayoutParams(dp(88), dp(88));
                  logoParams.bottomMargin = dp(24);
                  content.addView(logo, logoParams);
          
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleParams.bottomMargin = dp(8);
                  content.addView(title, titleParams);
                  content.addView(subtitle, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
          
                  FrameLayout.LayoutParams contentParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  contentParams.gravity = Gravity.CENTER;
                  launchOverlay.addView(content, contentParams);
                  root.addView(launchOverlay, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  logo.setScaleX(0.88f);
                  logo.setScaleY(0.88f);
                  logo.setAlpha(0f);
                  title.setAlpha(0f);
                  subtitle.setAlpha(0f);
          
                  DecelerateInterpolator interpolator = new DecelerateInterpolator(1.7f);
                  logo.animate().alpha(1f).scaleX(1f).scaleY(1f)
                          .setDuration(520).setInterpolator(interpolator).start();
                  title.animate().alpha(1f).setStartDelay(150).setDuration(420)
                          .setInterpolator(interpolator).start();
                  subtitle.animate().alpha(1f).setStartDelay(260).setDuration(360)
                          .setInterpolator(interpolator).start();
          
                  launchOverlay.postDelayed(() -> scheduleLaunchDismissal(0), 4000);
              }
          
              private void scheduleLaunchDismissal(long additionalDelay) {
                  if (launchDismissed || launchOverlay == null) {
                      return;
                  }
                  long elapsed = SystemClock.elapsedRealtime() - launchStartedAt;
                  long minVisible = 650;
                  long wait = Math.max(additionalDelay, minVisible - elapsed);
                  launchOverlay.postDelayed(this::dismissLaunchAnimation, Math.max(0, wait));
              }
          
              private void dismissLaunchAnimation() {
                  if (launchDismissed || launchOverlay == null) {
                      return;
                  }
                  launchDismissed = true;
                  launchOverlay.animate()
                          .alpha(0f)
                          .scaleX(1.015f)
                          .scaleY(1.015f)
                          .setDuration(360)
                          .setInterpolator(new DecelerateInterpolator(1.5f))
                          .withEndAction(() -> {
                              if (launchOverlay != null && root != null) {
                                  root.removeView(launchOverlay);
                                  launchOverlay = null;
                              }
                          })
                          .start();
              }
          
              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          
              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  requestBestRefreshRate();
                  if (webView != null) {
                      webView.post(() -> webView.requestApplyInsets());
                  }
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || pendingFileCallback == null) {
                      return;
                  }
          
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];
                          for (int i = 0; i < count; i++) {
                              results[i] = data.getClipData().getItemAt(i).getUri();
                              persistReadPermission(results[i]);
                          }
                      } else if (data.getData() != null) {
                          results = new Uri[] { data.getData() };
                          persistReadPermission(data.getData());
                      }
                  }
          
                  pendingFileCallback.onReceiveValue(results);
                  pendingFileCallback = null;
              }
          
              private void persistReadPermission(Uri uri) {
                  try {
                      getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (SecurityException ignored) {
                  }
              }
          
              @Override
              public void onBackPressed() {
                  if (launchOverlay != null && !launchDismissed) {
                      dismissLaunchAnimation();
                      return;
                  }
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          
              @Override
              protected void onDestroy() {
                  if (pendingFileCallback != null) {
                      pendingFileCallback.onReceiveValue(null);
                      pendingFileCallback = null;
                  }
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA

          # Substitute the real entry path without introducing Java annotations
          # or shell interpolation into the generated source.
          ENTRY_REL="$ENTRY_REL" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("android-project/app/src/main/java/com/personalreader/app/MainActivity.java")
          text = path.read_text(encoding="utf-8")
          entry = os.environ["ENTRY_REL"].replace("\\", "/").replace('"', '\\"')
          path.write_text(text.replace("__ENTRY_REL__", entry), encoding="utf-8")
          PY

      - name: Validate generated Android project
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/personalreader/app/MainActivity.java
          test -s "app/src/main/assets/${ENTRY_REL}"
          grep -q 'package com.personalreader.app;' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'START_PAGE' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'VERSION_CODE = 412' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'preferredRefreshRate' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'applySafeInsets' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'showLaunchAnimation' app/src/main/java/com/personalreader/app/MainActivity.java
          grep -q 'setDecorFitsSystemWindows(false)' app/src/main/java/com/personalreader/app/MainActivity.java
          ! grep -q 'androidx.annotation' app/src/main/java/com/personalreader/app/MainActivity.java
          ! grep -q 'androidx.webkit' app/src/main/java/com/personalreader/app/MainActivity.java

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 50000
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
