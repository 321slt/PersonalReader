name: Build Personal Reader Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalReader-Android-v4.11.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          test -s PersonalReader-Android-v4.11.zip
          rm -rf android-project
          mkdir android-project
          unzip -q PersonalReader-Android-v4.11.zip -d android-project
          PROJECT_DIR="$(find android-project -maxdepth 3 -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts inside PersonalReader-Android-v4.11.zip"
            find android-project -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Configure stable Android 16 SDK
        run: |
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/compileSdk = 37/compileSdk = 36/g; s/targetSdk = 37/targetSdk = 36/g; s/compileSdk 37/compileSdk 36/g; s/targetSdk 37/targetSdk 36/g' "$PROJECT_DIR/app/build.gradle.kts"
          grep -nE 'compileSdk|targetSdk' "$PROJECT_DIR/app/build.gradle.kts" || true

      - name: Install Gradle 9.6.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalReader-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
